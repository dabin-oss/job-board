name: collect-jobs
on:
  schedule:
    - cron: "*/30 * * * *"   # 약 30분마다 (GitHub 사정으로 수 분에서 수십 분 늦을 수 있음)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Collect
        env:
          SARAMIN_KEY: ${{ secrets.SARAMIN_KEY }}
        run: node scripts/collect.mjs
      - name: Commit if changed
        run: |
          git config user.name "job-board-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || (git commit -m "chore: update jobs" && git push)
