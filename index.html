<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>채용공고 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 상단 상태 요약 > 플랫폼 상태 > 필터 > 목록 위 새로고침 줄 > 카드 그리드. 스캔하고 조작하는 도구라 정보 밀도 우선 */
:root {
  --bg: #F1F4F2;
  --surface: #FFFFFF;
  --ink: #16201E;
  --muted: #5A6865;
  --line: #D8DFDC;
  --accent: #0F6B5A;
  --accent-ink: #FFFFFF;
  --soft: #E2F0EB;
  --warn: #9A4A08;
  --warn-bg: #FBEBDC;
  --crit: #B3261E;
  --crit-bg: #FBE3E0;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; padding-inline: 16px; padding-block: 24px 56px; }
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-size: 24px; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; }
h2 { font-size: 12px; margin: 0; font-weight: 600; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 8px 16px; }
.head p { margin: 4px 0 0; color: var(--muted); }
.stats { display: flex; flex-wrap: wrap; gap: 8px 20px; font-variant-numeric: tabular-nums; }
.stat { display: flex; align-items: baseline; gap: 6px; }
.stat b { font-family: var(--font-mono); font-size: 20px; font-weight: 500; }
.stat span { color: var(--muted); font-size: 12px; }

.notice { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 10px 14px; font-size: 13px; }

.plats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.plat { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.plat-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.plat-name { font-weight: 600; }
.pill { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--accent); white-space: nowrap; }
.pill.wait { background: var(--warn-bg); color: var(--warn); }
.pill.off { background: var(--line); color: var(--muted); }
.plat-cad { font-family: var(--font-mono); font-size: 12px; }
.plat-note { font-size: 12px; color: var(--muted); }

.filters { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.frow { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.field { display: flex; align-items: center; gap: 8px; min-width: 0; }
.field > label, .flabel { font-size: 12px; color: var(--muted); white-space: nowrap; }
select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; max-width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 12px; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }

.listbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px 16px; }
.listbar-left { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
.btn[disabled] { opacity: 0.6; cursor: progress; }
.btn svg { width: 14px; height: 14px; }
.btn.spin svg { animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.upd { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.upd button { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; cursor: not-allowed; }
.count { font-family: var(--font-mono); font-size: 13px; }

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 380px), 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.is-out { opacity: 0.55; }
.card.is-apply { border-color: var(--accent); }
.c-top { display: flex; gap: 12px; align-items: flex-start; }
.score { flex: none; width: 52px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.score b { font-family: var(--font-mono); font-size: 22px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
.score i { display: block; width: 100%; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.score i::after { content: ""; display: block; height: 100%; width: var(--w); background: var(--accent); }
.score.mid i::after { background: var(--warn); }
.score.low i::after { background: var(--muted); }
.c-main { min-width: 0; flex: 1; }
.company { font-size: 12px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: center; }
.title { font-size: 15px; font-weight: 600; line-height: 1.4; margin: 2px 0 0; overflow-wrap: anywhere; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-family: var(--font-mono); font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 4px; background: var(--ink); color: var(--bg); }
.tag.n { background: var(--accent); color: var(--accent-ink); }
.tag.d { background: var(--crit-bg); color: var(--crit); }
.tag.r { background: var(--soft); color: var(--accent); }
.reason { margin: 0; font-size: 13px; }
.loc { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.loc-tier { font-weight: 600; font-size: 13px; }
.loc-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.loc-sub .mono { font-family: var(--font-mono); color: var(--ink); }
.meta { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 12px; margin: 0; }
.meta dt { color: var(--muted); }
.meta dd { margin: 0; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.srcs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); }
.src { border: 1px solid var(--line); border-radius: 4px; padding: 1px 8px; color: var(--ink); }
details summary { cursor: pointer; font-size: 12px; color: var(--muted); }
.bd { margin: 6px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 12px; font-variant-numeric: tabular-nums; }
.bd span:nth-child(even) { font-family: var(--font-mono); text-align: right; }
.c-foot { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-top: auto; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { background: var(--bg); border: 0; border-right: 1px solid var(--line); padding: 5px 11px; font-size: 12px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button[data-s="제외"][aria-pressed="true"] { background: var(--muted); }
.link { font-size: 12px; color: var(--muted); }
.empty { grid-column: 1 / -1; background: var(--surface); border: 1px dashed var(--line); border-radius: 8px; padding: 32px 16px; text-align: center; color: var(--muted); }
.foot { font-size: 12px; color: var(--muted); }
.toast { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 420px; margin: 0 auto; background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 6px; font-size: 13px; }
@media (prefers-reduced-motion: reduce) { .btn.spin svg { animation: none; } }
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<main class="wrap">
  <header class="head">
    <div>
      <h1>채용공고 모음</h1>
      <p>프로덕트 디자이너 · UX/UI · PM 공고를 한 화면에서 비교하고 지원 상태를 관리해요.</p>
    </div>
    <div class="stats" id="stats" aria-live="polite"></div>
  </header>

  <div class="notice">지금 보이는 공고는 화면을 확인하기 위한 예시 데이터예요. 회사명과 내용은 모두 가상이고, 사람인·원티드 키를 연결하면 실제 공고로 바뀌어요.</div>

  <section aria-labelledby="h-plat" style="display:flex;flex-direction:column;gap:10px">
    <h2 id="h-plat">수집 플랫폼</h2>
    <div class="plats" id="plats"></div>
  </section>

  <section class="filters" aria-label="필터">
    <div class="frow">
      <span class="flabel">직무</span>
      <div class="chips" id="roleChips">
        <button class="chip" type="button" data-role="PD" aria-pressed="false">PD 프로덕트 디자이너</button>
        <button class="chip" type="button" data-role="UXUI" aria-pressed="false">UX/UI</button>
        <button class="chip" type="button" data-role="PM" aria-pressed="false">PM 기획</button>
      </div>
    </div>
    <div class="frow">
      <div class="field"><label for="fTier">지역</label>
        <select id="fTier">
          <option value="all">전체</option>
          <option value="1">애오개역 30분 이내</option>
          <option value="2">애오개역 1시간 이내</option>
          <option value="3">안성</option>
          <option value="4">안성 근처 (운전)</option>
          <option value="R">원격·재택</option>
        </select></div>
      <div class="field"><label for="fDead">마감</label>
        <select id="fDead">
          <option value="all">전체</option>
          <option value="3">D-3 이내</option>
          <option value="7">D-7 이내</option>
          <option value="open">상시·채용 시 마감</option>
        </select></div>
      <div class="field"><label for="fPlat">플랫폼</label>
        <select id="fPlat">
          <option value="all">전체</option>
          <option>사람인</option><option>원티드</option><option>잡코리아</option><option>리멤버</option><option>그룹바이</option>
        </select></div>
      <div class="field"><label for="fStat">상태</label>
        <select id="fStat">
          <option value="all">제외 빼고 전체</option>
          <option>관심</option><option>지원함</option><option>보류</option><option>제외</option>
        </select></div>
      <label class="check"><input type="checkbox" id="fNew"> 신규만 보기</label>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:12px" aria-label="공고 목록">
    <div class="listbar">
      <div class="listbar-left">
        <button class="btn" type="button" id="refresh">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.5 2.5v3h-3"/></svg>
          <span id="refreshLabel">전체 새로고침</span>
        </button>
        <span class="upd" id="upd"></span>
      </div>
      <div class="listbar-left">
        <span class="count" id="count"></span>
        <div class="field"><label for="fSort">정렬</label>
          <select id="fSort">
            <option value="score">적합도순</option>
            <option value="dead">마감 임박순</option>
            <option value="new">최신순</option>
          </select></div>
      </div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <p class="foot">지원 상태는 이 브라우저에만 저장돼요. 다른 기기와는 공유되지 않아요. 통근 시간은 출근 시간대 기준으로 계산할 예정이고, 지금 값은 예시예요.</p>
</main>
<div class="toast" id="toast" hidden></div>

  ];

  var PLATS = [
    { n: "사람인", cad: "약 30분마다 업데이트", st: "승인 대기", cls: "wait", note: "공식 API 신청 전. 하루 500회 한도 안에서 호출" },
    { n: "원티드", cad: "약 30분마다 업데이트", st: "키 신청 전", cls: "wait", note: "공식 OpenAPI. 키 발급까지 3영업일" },
    { n: "잡코리아", cad: "알림 메일 도착 시 반영", st: "연동 예정", cls: "off", note: "공식 API 대상이 아니라 알림 메일로 연동" },
    { n: "리멤버 · 그룹바이 · 로켓펀치", cad: "수집 방식 확인 전", st: "미연동", cls: "off", note: "공식 경로와 약관 확인 후 결정" }
  ];

  var state = { roles: [], tier: "all", dead: "all", plat: "all", stat: "all", onlyNew: false, sort: "score" };
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { saved = {}; }
  var lastUpdated = new Date();

  function persist() { try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch (e) {} }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function hhmm(d) { return pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function total(j) { return j.s[0] + j.s[1] + j.s[2] + j.s[3] + LOC_PTS[j.tier]; }
  function dateOf(j) { if (j.dead === null) return null; var d = new Date(BASE); d.setDate(d.getDate() + j.dead); return d; }
  var DOW = ["일", "월", "화", "수", "목", "금", "토"];
  function fmtDate(d) { return pad(d.getMonth() + 1) + "." + pad(d.getDate()) + "(" + DOW[d.getDay()] + ")"; }
  function $(id) { return document.getElementById(id); }

  function visible() {
    var list = JOBS.filter(function (j) {
      var st = saved[j.id] || "";
      if (state.roles.length && state.roles.indexOf(j.role) < 0) return false;
      if (state.tier !== "all" && j.tier !== state.tier) return false;
      if (state.plat !== "all" && j.src.indexOf(state.plat) < 0) return false;
      if (state.onlyNew && j.posted >= 24) return false;
      if (state.dead === "3" && !(j.dead !== null && j.dead <= 3)) return false;
      if (state.dead === "7" && !(j.dead !== null && j.dead <= 7)) return false;
      if (state.dead === "open" && j.dead !== null) return false;
      if (state.stat === "all") { if (st === "제외") return false; }
      else if (st !== state.stat) return false;
      return true;
    });
    list.sort(function (a, b) {
      if (state.sort === "score") return total(b) - total(a);
      if (state.sort === "new") return a.posted - b.posted;
      var da = a.dead === null ? 9999 : a.dead, db = b.dead === null ? 9999 : b.dead;
      return da - db || total(b) - total(a);
    });
    return list;
  }

  function cardHtml(j) {
    var st = saved[j.id] || "";
    var t = total(j);
    var cls = t >= 80 ? "" : (t >= 65 ? " mid" : " low");
    var dd = dateOf(j);
    var badges = '<span class="tag">' + j.role + '</span>';
    if (j.posted < 24) badges += '<span class="tag n">신규</span>';
    if (j.dead !== null && j.dead <= 3) badges += '<span class="tag d">마감 임박</span>';
    if (j.tier === "R") badges += '<span class="tag r">원격</span>';
    var sub;
    if (j.tier === "1" || j.tier === "2") sub = j.area + ' · <span class="mono">' + j.min + '분</span> · ' + j.mode;
    else if (j.tier === "3") sub = j.area;
    else if (j.tier === "4") sub = j.area + ' · 운전 <span class="mono">' + j.min + '분</span>';
    else sub = "근무지 점수 없음";
    var dl = dd ? (fmtDate(dd) + " · D-" + (j.dead === 0 ? "Day" : j.dead)) : "상시채용·채용 시 마감";
    var srcs = j.src.map(function (s) { return '<span class="src">' + s + '</span>'; }).join("");
    var seg = STATUSES.map(function (s) {
      return '<button type="button" data-s="' + s + '" data-id="' + j.id + '" aria-pressed="' + (st === s) + '">' + s + '</button>';
    }).join("");
    var locPt = LOC_PTS[j.tier];
    return '<article class="card' + (st === "제외" ? " is-out" : "") + (st === "지원함" ? " is-apply" : "") + '">' +
      '<div class="c-top"><div class="score' + cls + '" title="적합도 점수"><b>' + t + '</b><i style="--w:' + t + '%"></i></div>' +
      '<div class="c-main"><div class="company"><span>' + j.co + '</span><span>' + j.size + '</span></div>' +
      '<h3 class="title">' + j.ti + '</h3></div></div>' +
      '<div class="badges">' + badges + '</div>' +
      '<p class="reason">' + j.why + '</p>' +
      '<div class="loc"><div class="loc-tier">' + TIER_LABEL[j.tier] + '</div><div class="loc-sub">' + sub + ' · ' + j.addr + '</div></div>' +
      '<dl class="meta"><dt>경력</dt><dd>' + j.car + '</dd><dt>마감</dt><dd>' + dl + '</dd></dl>' +
      '<div class="srcs"><span>출처</span>' + srcs + '</div>' +
      '<details><summary>점수 근거</summary><ul class="bd">' +
      '<li style="display:contents"><span>직무 일치</span><span>' + j.s[0] + ' / 30</span></li>' +
      '<li style="display:contents"><span>경력 구간</span><span>' + j.s[1] + ' / 20</span></li>' +
      '<li style="display:contents"><span>도메인</span><span>' + j.s[2] + ' / 25</span></li>' +
      '<li style="display:contents"><span>업무 키워드</span><span>' + j.s[3] + ' / 15</span></li>' +
      '<li style="display:contents"><span>근무지</span><span>' + locPt + ' / 10</span></li></ul></details>' +
      '<div class="c-foot"><div class="seg" role="group" aria-label="지원 상태">' + seg + '</div>' +
      '<span class="link" title="실제 공고를 연결하면 원문 링크가 열려요">원문 링크 연결 전</span></div></article>';
  }

  function renderStats() {
    var live = JOBS.filter(function (j) { return saved[j.id] !== "제외"; });
    var nNew = live.filter(function (j) { return j.posted < 24; }).length;
    var nDue = live.filter(function (j) { return j.dead !== null && j.dead <= 3; }).length;
    var nFav = JOBS.filter(function (j) { return saved[j.id] === "관심"; }).length;
    var nApp = JOBS.filter(function (j) { return saved[j.id] === "지원함"; }).length;
    function s(n, l) { return '<div class="stat"><b>' + n + '</b><span>' + l + '</span></div>'; }
    $("stats").innerHTML = s(live.length, "공고") + s(nNew, "신규") + s(nDue, "마감 임박") + s(nFav, "관심") + s(nApp, "지원함");
  }

  function renderUpd() {
    var next = new Date(lastUpdated.getTime() + 30 * 60000);
    $("upd").innerHTML = "마지막 업데이트 " + hhmm(lastUpdated) + " · 다음 예정 " + hhmm(next) + " · <button type=\"button\" disabled title=\"레포를 연결하면 쓸 수 있어요\">수집 즉시 실행</button>";
  }

  function render() {
    var list = visible();
    $("count").textContent = list.length + "건";
    $("grid").innerHTML = list.length ? list.map(cardHtml).join("") : '<div class="empty">조건에 맞는 공고가 없어요. 필터를 줄여보세요.</div>';
    renderStats();
  }

  $("plats").innerHTML = PLATS.map(function (p) {
    return '<div class="plat"><div class="plat-top"><span class="plat-name">' + p.n + '</span><span class="pill ' + p.cls + '">' + p.st + '</span></div>' +
      '<div class="plat-cad">' + p.cad + '</div><div class="plat-note">' + p.note + '</div></div>';
  }).join("");

  $("roleChips").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-role]"); if (!b) return;
    var r = b.getAttribute("data-role"), i = state.roles.indexOf(r);
    if (i < 0) state.roles.push(r); else state.roles.splice(i, 1);
    b.setAttribute("aria-pressed", i < 0 ? "true" : "false");
    render();
  });
  [["fTier", "tier"], ["fDead", "dead"], ["fPlat", "plat"], ["fStat", "stat"], ["fSort", "sort"]].forEach(function (p) {
    $(p[0]).addEventListener("change", function () { state[p[1]] = this.value; render(); });
  });
  $("fNew").addEventListener("change", function () { state.onlyNew = this.checked; render(); });

  $("grid").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-s]"); if (!b) return;
    var id = b.getAttribute("data-id"), s = b.getAttribute("data-s");
    if (saved[id] === s) delete saved[id]; else saved[id] = s;
    persist(); render();
  });

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2800);
  }
  $("refresh").addEventListener("click", function () {
    var btn = this; btn.disabled = true; btn.classList.add("spin"); $("refreshLabel").textContent = "불러오는 중";
    setTimeout(function () {
      lastUpdated = new Date(); renderUpd(); render();
      btn.disabled = false; btn.classList.remove("spin"); $("refreshLabel").textContent = "전체 새로고침";
      toast("최신 공고 목록을 다시 불러왔어요. 예시 데이터라 내용은 그대로예요.");
    }, 700);
  });

  renderUpd(); render();
})();
</script>
</body>
</html>
